<!doctype html>
<html lang="__DIL__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyncYourPods</title>
<style>
  :root {
    --zemin: #f2f2f7; --kart: #ffffff; --kart2: #e5e5ea; --dolgu: rgba(118,118,128,.12); --dolgu2: rgba(118,118,128,.2);
    --yazi: #000; --ikincil: rgba(60,60,67,.6); --ucuncul: rgba(60,60,67,.3); --cizgi: rgba(60,60,67,.18);
    --mavi: #007aff; --turuncu: #ff9500; --yesil: #34c759; --kirmizi: #ff3b30; --indigo: #5856d6; --pembe: #ff2d55;
    --teal: #30b0c7; --mor: #af52de; --gri: #8e8e93; --golge: 0 8px 24px rgba(0,0,0,.08);
    --cubuk: rgba(242,242,247,.86);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --zemin: #000; --kart: #1c1c1e; --kart2: #2c2c2e; --dolgu: rgba(118,118,128,.24); --dolgu2: rgba(118,118,128,.32);
      --yazi: #fff; --ikincil: rgba(235,235,245,.6); --ucuncul: rgba(235,235,245,.3); --cizgi: rgba(84,84,88,.6);
      --mavi: #0a84ff; --turuncu: #ff9f0a; --yesil: #30d158; --kirmizi: #ff453a; --indigo: #5e5ce6; --pembe: #ff375f;
      --teal: #40c8e0; --mor: #bf5af2; --gri: #8e8e93; --golge: none; --cubuk: rgba(0,0,0,.82);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--zemin); color: var(--yazi); }
  body {
    font: 15px/1.35 -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }

  /* Sayfa yığını (iOS gezinmesi) */
  #yigin { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .sayfa { position: absolute; inset: 0; background: var(--zemin); display: flex; flex-direction: column;
    transition: transform .42s cubic-bezier(.32,.72,0,1), filter .42s; will-change: transform; }
  .sayfa.sag { transform: translateX(100%); }
  .sayfa.geride { transform: translateX(-28%); filter: brightness(.92); }
  .ust { height: 52px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 10px;
    background: var(--cubuk); backdrop-filter: saturate(180%) blur(20px); position: relative; z-index: 2; }
  .ust .baslik { font-weight: 600; font-size: 16px; text-align: center; white-space: nowrap; }
  .ust .sol { justify-self: start; } .ust .sag-k { justify-self: end; }
  .geri { display: flex; align-items: center; gap: 2px; color: var(--mavi); font-size: 16px; padding: 6px 6px 6px 2px; border-radius: 8px; }
  .geri:hover, .yuvarlak:hover { background: var(--dolgu); }
  .yuvarlak { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--yazi); }
  .icerik { flex: 1; overflow-y: auto; padding: 4px 16px 24px; scrollbar-width: thin; }
  .icerik::-webkit-scrollbar { width: 6px } .icerik::-webkit-scrollbar-thumb { background: var(--dolgu2); border-radius: 3px; }

  /* Kartlar ve listeler */
  .kart { background: var(--kart); border-radius: 18px; padding: 14px; box-shadow: var(--golge); }
  .bolum-bas { font-size: 12px; text-transform: uppercase; letter-spacing: .02em; color: var(--ikincil); padding: 18px 14px 6px; }
  .bolum-not { font-size: 12.5px; color: var(--ikincil); padding: 6px 14px 0; line-height: 1.4; }
  .liste { background: var(--kart); border-radius: 12px; overflow: hidden; box-shadow: var(--golge); }
  .satir { display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 46px; position: relative; width: 100%; text-align: left; }
  .satir + .satir::before { content: ""; position: absolute; top: 0; right: 0; left: 14px; height: .5px; background: var(--cizgi); }
  .satir.simgeli + .satir.simgeli::before { left: 55px; }
  button.satir:hover, .satir.tik:hover { background: var(--dolgu); }
  .satir .ad { flex: 1; min-width: 0; padding: 11px 0; }
  .satir .ad small { display: block; font-size: 12.5px; color: var(--ikincil); margin-top: 1px; }
  .satir .deger { color: var(--ikincil); white-space: nowrap; }
  .satir .ok { color: var(--ucuncul); }
  .satir.tehlike { color: var(--kirmizi); }
  .satir.mavi { color: var(--mavi); }
  .ayar-simge { width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: none; }
  .ayar-simge svg { width: 17px; height: 17px; }
  .tik-isaret { color: var(--mavi); opacity: 0; } .secili .tik-isaret { opacity: 1; }

  /* iOS anahtarı */
  .anahtar { width: 51px; height: 31px; border-radius: 16px; background: var(--dolgu2); position: relative; flex: none; transition: background .25s; }
  .anahtar::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .25s cubic-bezier(.3,.7,.4,1); }
  .anahtar.acik { background: var(--yesil); } .anahtar.acik::after { transform: translateX(20px); }

  /* Kaydırıcı */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; flex: 1; --dolu: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--mavi) var(--dolu), var(--dolgu2) var(--dolu)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; margin-top: -11px;
    box-shadow: 0 0.5px 4px rgba(0,0,0,.12), 0 6px 13px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); cursor: grab; }
  .kaydir { display: flex; align-items: center; gap: 10px; color: var(--ikincil); }

  /* Bölümlü seçici */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--dolgu); border-radius: 9px; padding: 2px; position: relative; }
  .seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; position: relative; z-index: 1; transition: background .2s; }
  .seg button.secili { background: var(--kart); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .seg button.secili { background: #636366; } }

  /* Ana ekran */
  .kahraman { display: flex; flex-direction: column; align-items: center; padding: 6px 0 14px; }
  .daire { width: 136px; height: 136px; position: relative; display: grid; place-items: center; --renk: var(--gri); --sev: 0; }
  .daire .zemin { position: absolute; inset: 0; border-radius: 50%; background: var(--renk); opacity: .1; transform: scale(calc(1 + var(--sev) * .07)); transition: transform .12s; }
  .daire .halka { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--renk); opacity: 0; }
  .daire.aktif .halka { animation: dalga 2.4s cubic-bezier(.2,.6,.3,1) infinite; }
  .daire.aktif .halka:nth-child(3) { animation-delay: .8s } .daire.aktif .halka:nth-child(4) { animation-delay: 1.6s }
  @keyframes dalga { from { transform: scale(1); opacity: .45 } to { transform: scale(1.55); opacity: 0 } }
  .daire .ic { width: 98px; height: 98px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: linear-gradient(180deg, color-mix(in srgb, var(--renk) 96%, #fff), color-mix(in srgb, var(--renk) 78%, #000));
    box-shadow: 0 12px 28px color-mix(in srgb, var(--renk) 40%, transparent); transition: background .5s, box-shadow .5s; position: relative; }
  .daire .ic svg { width: 50px; height: 50px; }
  .kahraman h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin-top: 12px; text-align: center; }
  .kahraman p { color: var(--ikincil); font-size: 14px; margin-top: 2px; text-align: center; }

  .zincir { display: flex; align-items: flex-start; }
  .dugum { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 78px; flex: none; }
  .dugum .yuv { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--dolgu); color: var(--yazi);
    border: 1.5px solid transparent; transition: all .35s; }
  .dugum .yuv svg { width: 22px; height: 22px; }
  .dugum span { font-size: 12px; color: var(--ikincil); max-width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dugum.vurgu .yuv { color: var(--v); border-color: var(--v); background: color-mix(in srgb, var(--v) 14%, transparent); }
  .dugum.soluk { opacity: .4; }
  .hat { flex: 1; height: 3px; border-radius: 2px; background: var(--dolgu); margin-top: 23px; position: relative; overflow: hidden; }
  .hat.akiyor { background: color-mix(in srgb, var(--v) 25%, transparent); }
  .hat i { position: absolute; top: -1.5px; width: 6px; height: 6px; border-radius: 50%; background: var(--v); opacity: 0; }
  .hat.akiyor i { animation: ak 1.1s linear infinite; } .hat.akiyor i:nth-child(2) { animation-delay: -.37s } .hat.akiyor i:nth-child(3) { animation-delay: -.73s }
  @keyframes ak { from { left: -6px; opacity: 0 } 25% { opacity: 1 } 75% { opacity: 1 } to { left: 100%; opacity: 0 } }

  .calan { display: flex; align-items: center; gap: 12px; }
  #calan-kart { padding: 10px 12px; }
  .calan .k { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; color: var(--mavi); background: color-mix(in srgb, var(--mavi) 13%, transparent); flex: none; }
  .calan .y { flex: 1; min-width: 0; }
  .calan b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .calan small { color: var(--ikincil); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .rozet { font-size: 11px; font-weight: 600; color: var(--turuncu); background: color-mix(in srgb, var(--turuncu) 14%, transparent); padding: 3px 8px; border-radius: 99px; }
  .dalga-simge span { display: inline-block; width: 3px; margin: 0 1px; border-radius: 2px; background: currentColor; height: 6px; vertical-align: middle; }
  .dalga-simge.oynuyor span { animation: cubuk 1s ease-in-out infinite; }
  .dalga-simge span:nth-child(2) { animation-delay: -.3s } .dalga-simge span:nth-child(3) { animation-delay: -.6s } .dalga-simge span:nth-child(4) { animation-delay: -.15s }
  @keyframes cubuk { 0%,100% { height: 5px } 50% { height: 18px } }

  .kutular { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--kart); border-radius: 18px; padding: 12px 6px 10px; box-shadow: var(--golge); }
  .kutu { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; border-radius: 12px; padding: 2px 0; }
  .kutu .s { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--dolgu); transition: background .25s, color .25s, transform .15s; }
  .kutu:hover .s { background: var(--dolgu2); } .kutu:active .s { transform: scale(.92); }
  .kutu .s svg { width: 21px; height: 21px; }
  .kutu.acik .s, .kutu.acik:hover .s { background: var(--r); color: #fff; }
  .kutu b { font-size: 11.5px; font-weight: 600; display: block; line-height: 1.2; }
  .kutu small { font-size: 10.5px; color: var(--ikincil); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 82px; }
  .not { display: flex; gap: 8px; font-size: 12.5px; color: var(--ikincil); padding: 10px 4px 0; line-height: 1.4; }
  .not svg { flex: none; width: 15px; height: 15px; margin-top: 1px; }
  .alt-satir { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 12px; color: var(--ikincil); padding: 14px 0 2px; width: 100%; }
  .alt-satir:hover { color: var(--yazi); }
  .nokta { width: 7px; height: 7px; border-radius: 50%; background: var(--yesil); }
  .yigit > * + * { margin-top: 10px; }
  .adim { display: grid; grid-template-columns: 24px 1fr; gap: 12px; font-size: 14px; align-items: start; }
  .adim + .adim { margin-top: 12px; }
  .adim i { width: 22px; height: 22px; border-radius: 50%; background: var(--mavi); color: #fff; font: 700 12px/22px inherit; font-style: normal; text-align: center; }
  .donen { width: 14px; height: 14px; border: 2px solid var(--dolgu2); border-top-color: var(--ikincil); border-radius: 50%; animation: don 1s linear infinite; }
  @keyframes don { to { transform: rotate(360deg) } }

  /* Ekolayzer */
  .egri { height: 120px; } .egri path { transition: d .35s; }
  .bant-etiket { display: flex; justify-content: space-between; font-size: 10px; color: var(--ikincil); padding-top: 6px; }
  .dikeyler { display: flex; height: 200px; padding: 8px 0 4px; }
  .dikey { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .dikey .db { font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ikincil); }
  .dikey .db.d { color: var(--indigo); }
  .dikey .ray { flex: 1; width: 22px; position: relative; cursor: ns-resize; touch-action: none; }
  .dikey .ray::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--dolgu2); }
  .dikey .dolu { position: absolute; left: 9px; width: 4px; border-radius: 2px; background: var(--indigo); }
  .dikey .top { position: absolute; left: 1px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); margin-top: -10px; }
  .dikey span { font-size: 9.5px; color: var(--ikincil); }

  .buyuk-sayi { font: 600 44px/1 -apple-system, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .parcalar { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-top: 14px; }
  .parcalar b { display: block; font-variant-numeric: tabular-nums; font-size: 15px; }
  .parcalar small { color: var(--ikincil); font-size: 11.5px; }
  .uygulama-simge { width: 76px; height: 76px; border-radius: 18px; background: linear-gradient(135deg, #0a84ff, #5e5ce6); display: grid; place-items: center; margin: 0 auto; box-shadow: 0 10px 24px rgba(10,132,255,.3); }
  .pasif { opacity: .45; pointer-events: none; }
  .gizli { display: none !important; }
  .gr { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="yigin"></div>

<script>
"use strict";
const EN = document.documentElement.lang === "en" || new URLSearchParams(location.search).get("dil") === "en";
const T = (tr, en) => EN ? en : tr;
// ───────────────────────── Simgeler (SF Symbols benzeri, çizgi) ─────────────────────────
const S_ = (yol, g = 24) => `<svg viewBox="0 0 ${g} ${g}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${yol}</svg>`;
const SIMGE = {
  airpods: `<svg viewBox="0 0 48 48" fill="currentColor"><path d="M14.5 7c-4.7 0-8.5 3.8-8.5 8.5 0 3.6 2.3 6.7 5.5 7.9V38a3 3 0 0 0 6 0V21.3c1.8-1.5 3-3.4 3-5.8C20.5 10.8 18.7 7 14.5 7zm19 0c-4.2 0-6 3.8-6 8.5 0 2.4 1.2 4.3 3 5.8V38a3 3 0 0 0 6 0V23.4c3.2-1.2 5.5-4.3 5.5-7.9C42 10.8 38.2 7 33.5 7z"/><circle cx="10.8" cy="16.6" r="1.7" fill="rgba(0,0,0,.25)"/><circle cx="37.2" cy="16.6" r="1.7" fill="rgba(0,0,0,.25)"/></svg>`,
  kulaklik: S_('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="7" rx="2"/><rect x="16.5" y="14" width="4.5" height="7" rx="2"/>'),
  pc: S_('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),
  iphone: S_('<rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.5 18.5h3"/>'),
  mik: S_('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>'),
  mikYok: S_('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M4 4l16 16"/>'),
  degis: S_('<path d="M7 7h12l-3-3M17 17H5l3 3"/>'),
  eq: S_('<path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="14" r="2" fill="currentColor"/><circle cx="12" cy="8" r="2" fill="currentColor"/><circle cx="18" cy="15" r="2" fill="currentColor"/>'),
  sure: S_('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/>'),
  ses: S_('<path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'),
  sesAz: S_('<path d="M5 9.5h3.5L13 5v14l-4.5-4.5H5z" fill="currentColor"/>'),
  disli: S_('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'),
  sag: S_('<path d="M9 5l7 7-7 7"/>'),
  sol: S_('<path d="M15 5l-7 7 7 7"/>'),
  kulak: S_('<path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 0"/><path d="M10 9.5a2 2 0 0 1 4 0"/>'),
  nabiz: S_('<path d="M3 12h4l2-5 4 10 2-5h6"/>'),
  bilgi: S_('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'),
  titresim: S_('<rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 8v8M20 8v8"/>'),
  el: S_('<path d="M9 11V5a1.5 1.5 0 0 1 3 0v6m0-1V4a1.5 1.5 0 0 1 3 0v7m0-2a1.5 1.5 0 0 1 3 0v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4 13.5a1.6 1.6 0 0 1 2.6-1.9L9 14"/>'),
  uyari: S_('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>'),
  baglanti: S_('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
  guc: S_('<path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/>'),
  belge: S_('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>'),
  isaret: S_('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
};
const simgeKutu = (ad, renk) => `<span class="ayar-simge" style="background:${renk}">${SIMGE[ad]}</span>`;

// ───────────────────────── Durum ve köprü ─────────────────────────
let D = null;              // Rust'tan gelen son durum
let surukleniyor = null;   // elle kaydırılan denetim (o an gelen durumla geri sıçramasın)
const ipcVar = !!(window.ipc && window.ipc.postMessage);
const yolla = (m) => { if (ipcVar) window.ipc.postMessage(JSON.stringify(m)); };
const A = () => (D && D.tel && D.tel.settings) || null;   // telefon ayarları
const bagli = () => !!(D && D.telefonAdi);
const telVar = () => !!A();

function telAyar(k, v) {
  const a = A(); if (!a) return;
  a[k] = v;
  yolla({ k: "set", v: { [k]: v } });
  guncelle();
}
function pcAyar(ad, v) { if (D) D.pc[ad] = v; yolla({ k: "pc", ad, v }); guncelle(); }

window.durum = (d) => {
  // Kaydırırken gelen eski değer elimizdeki değeri ezmesin.
  if (surukleniyor && A() && d.tel && d.tel.settings) d.tel.settings[surukleniyor.k] = surukleniyor.v;
  D = d;
  guncelle();
};

const yigin = [];
const kok = document.getElementById("yigin");
function sayfaKur(ad) {
  const t = SAYFA[ad];
  const el = document.createElement("div");
  el.className = "sayfa"; el.dataset.ad = ad;
  const ust = ad === "ana"
    ? `<div class="ust"><span class="sol" style="font-weight:600;font-size:15px;padding-left:6px">SyncYourPods</span><span></span><span class="sag-k"><button class="yuvarlak" data-git="ayarlar" title="${T("Ayarlar", "Settings")}">${SIMGE.disli.replace('<svg', '<svg width="20" height="20"')}</button></span></div>`
    : `<div class="ust"><span class="sol"><button class="geri">${SIMGE.sol.replace('<svg', '<svg width="20" height="20"')}<span>${yigin.length > 1 ? SAYFA[yigin[yigin.length - 1].dataset.ad].baslik || T("Geri", "Back") : T("Geri", "Back")}</span></button></span><span class="baslik">${t.baslik}</span><span></span></div>`;
  el.innerHTML = ust + `<div class="icerik">${t.ciz()}</div>`;
  const g = el.querySelector(".geri"); if (g) g.onclick = geri;
  el.addEventListener("click", tikla);
  el.addEventListener("input", kaydirma);
  el.addEventListener("change", kaydirmaBitti);
  if (t.bagla) t.bagla(el);
  return el;
}
function git(ad) {
  if (ad === "ayarlar" || yigin.length) { /* geri yazısı için yığının üstü */ }
  const onceki = yigin[yigin.length - 1];
  const el = sayfaKur(ad);
  el.classList.add("sag"); kok.appendChild(el); yigin.push(el);
  guncelle();
  void el.offsetWidth; // yerleşimi zorla: geçiş animasyon karesi beklemeden başlasın
  el.classList.remove("sag"); if (onceki) onceki.classList.add("geride");
}
function geri() {
  if (yigin.length < 2) return;
  const el = yigin.pop(); const alt = yigin[yigin.length - 1];
  el.classList.add("sag"); alt.classList.remove("geride");
  setTimeout(() => el.remove(), 450);
  guncelle();
}

// ───────────────────────── Etkileşim ─────────────────────────
function tikla(e) {
  const gitEl = e.target.closest("[data-git]");
  if (gitEl && !e.target.closest("[data-tel],[data-pc]")) {
    if (gitEl.id === "k-eq" && !telVar()) return;
    git(gitEl.dataset.git); return;
  }
  const an = e.target.closest(".anahtar");
  if (an) {
    if (an.dataset.tel && A()) telAyar(an.dataset.tel, !A()[an.dataset.tel]);
    if (an.dataset.pc && D) pcAyar(an.dataset.pc, !D.pc[an.dataset.pc]);
    return;
  }
  const sec = e.target.closest("[data-sec]");
  if (sec && A()) { telAyar(sec.dataset.sec, sec.dataset.deger); return; }
  const sg = e.target.closest(".seg button");
  if (sg && A()) {
    const k = sg.parentElement.dataset.seg, ham = sg.dataset.deger;
    telAyar(k, isNaN(Number(ham)) ? ham : Number(ham));
  }
}
let sonGonderim = 0, bekleyen = null;
function kaydirma(e) {
  const r = e.target; if (r.type !== "range" || !r.dataset.tel) return;
  let v = Number(r.value);
  if (r.dataset.orta && Math.abs(v) < 0.06) v = 0;
  surukleniyor = { k: r.dataset.tel, v };
  if (A()) A()[r.dataset.tel] = v;
  dolulukCiz(r);
  yazilariGuncelle();
  // En fazla 20 kez/sn gönder.
  const simdi = performance.now();
  if (simdi - sonGonderim > 50) { sonGonderim = simdi; yolla({ k: "set", v: { [r.dataset.tel]: v } }); }
  else { clearTimeout(bekleyen); bekleyen = setTimeout(() => yolla({ k: "set", v: { [r.dataset.tel]: v } }), 60); }
}
function kaydirmaBitti(e) {
  const r = e.target; if (r.type !== "range" || !r.dataset.tel) return;
  let v = Number(r.value); if (r.dataset.orta && Math.abs(v) < 0.06) { v = 0; r.value = 0; }
  yolla({ k: "set", v: { [r.dataset.tel]: v } });
  setTimeout(() => { surukleniyor = null; }, 400);
}
const dolulukCiz = (r) => r.style.setProperty("--dolu", ((r.value - r.min) / (r.max - r.min) * 100) + "%");

// Özel ekolayzer: dikey kaydırıcılar
function dikeyleriCiz(k) {
  const kap = document.getElementById("dikeyler"); if (!kap) return;
  if (!kap.children.length) {
    const et = ["32", "64", "125", "250", "500", "1K", "2K", "4K", "8K", "16K"];
    kap.innerHTML = et.map((x, i) => `<div class="dikey" data-i="${i}"><span class="db"></span><div class="ray"><div class="dolu"></div><div class="top"></div></div><span>${x}</span></div>`).join("");
    kap.querySelectorAll(".ray").forEach((ray) => {
      const i = Number(ray.parentElement.dataset.i);
      const ayarla = (y) => {
        const h = ray.clientHeight; let v = (h / 2 - y) / (h / 2) * 12;
        v = Math.max(-12, Math.min(12, Math.round(v * 2) / 2));
        const a = A(); if (!a) return;
        const yeni = (a.eqOzel || Array(10).fill(0)).slice(); if (yeni[i] === v) return;
        yeni[i] = v; a.eqOzel = yeni; surukleniyor = { k: "eqOzel", v: yeni };
        dikeyleriCiz(yeni); SAYFA.eq.guncelle();
        yolla({ k: "set", v: { eqOzel: yeni } });
      };
      ray.addEventListener("pointerdown", (e) => { ray.setPointerCapture(e.pointerId); ayarla(e.offsetY); });
      ray.addEventListener("pointermove", (e) => { if (ray.hasPointerCapture(e.pointerId)) ayarla(e.offsetY); });
      ray.addEventListener("pointerup", () => setTimeout(() => { surukleniyor = null; }, 400));
    });
  }
  kap.querySelectorAll(".dikey").forEach((d) => {
    const i = Number(d.dataset.i), v = k[i] || 0, h = d.querySelector(".ray").clientHeight || 150;
    const y = h / 2 - v / 12 * (h / 2);
    d.querySelector(".top").style.top = y + "px";
    const dolu = d.querySelector(".dolu"); dolu.style.top = Math.min(y, h / 2) + "px"; dolu.style.height = Math.abs(y - h / 2) + "px";
    const db = d.querySelector(".db"); db.textContent = v === 0 ? "0" : (v > 0 ? "+" : "") + (Number.isInteger(v) ? v : v.toFixed(1)); db.classList.toggle("d", v !== 0);
  });
}

  ust.querySelector(".icerik").classList.toggle("pasif", !!t.telGerek && !a);
  if (t.guncelle) t.guncelle();
  ust.querySelectorAll(".anahtar").forEach((e) => {
    const v = e.dataset.tel ? (a && a[e.dataset.tel]) : (D.pc[e.dataset.pc]);

  ust.querySelectorAll("input[type=range][data-tel]").forEach((r) => {
